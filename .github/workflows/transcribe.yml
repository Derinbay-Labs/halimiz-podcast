name: Transkript ve sosyal görseller

# Runs after each "Bölüm yayımla" run, on demand, or when a clip.json / the tools change.
# Transcribes with faster-whisper on the runner's CPU (~10 min for a 25-min episode),
# renders the 60 s audiogram + quote card, uploads them to the episode's release and
# commits the transcript so the episode page and search engines get the text.

on:
  workflow_run:
    workflows: ["Bölüm yayımla"]
    types: [completed]
  workflow_dispatch:
    inputs:
      date:
        description: "Bölüm tarihi (YYYY-MM-DD); boş bırakılırsa transkripti olmayan bölümler"
        required: false
      force:
        description: "Var olan transkripti yeniden üret"
        type: boolean
        default: false
  push:
    branches: ["master"]
    paths:
      - "episodes/*/clip.json"
      - "tools/transcribe.py"
      - "tools/social.py"
      - ".github/workflows/transcribe.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: transcribe
  cancel-in-progress: false

jobs:
  run:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-inter >/dev/null || sudo apt-get install -y -qq ffmpeg fonts-dejavu-core >/dev/null
          pip install -q faster-whisper pillow
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3-turbo-ct2
      - name: Pick episodes
        id: pick
        env:
          IN_DATE: ${{ github.event.inputs.date }}
          IN_FORCE: ${{ github.event.inputs.force }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os, subprocess
          from pathlib import Path
          eps = sorted(json.load(open("episodes.json")), key=lambda e: e["date"], reverse=True)
          force = os.environ.get("IN_FORCE") == "true"
          if os.environ.get("IN_DATE"):
              dates = [os.environ["IN_DATE"]]
          elif os.environ.get("GITHUB_EVENT_NAME") == "push":
              # clip.json edits re-render the social assets for those dates; tool edits only process missing ones
              changed = subprocess.run(["git", "diff", "--name-only", "HEAD~1", "HEAD"], capture_output=True, text=True).stdout.split()
              dates = sorted({p.split("/")[1] for p in changed if p.startswith("episodes/") and p.endswith("clip.json")}, reverse=True)
              dates = dates or [e["date"] for e in eps if not Path(f"episodes/{e['date']}/transcript.json").exists()][:2]
          else:
              dates = [e["date"] for e in eps if force or not Path(f"episodes/{e['date']}/transcript.json").exists()][:2]
          print("dates=" + " ".join(dates))
          print("force=" + ("true" if force else "false"))
          EOF
          cat "$GITHUB_OUTPUT"
      - name: Transcribe and render
        if: steps.pick.outputs.dates != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          for d in ${{ steps.pick.outputs.dates }}; do
            python3 tools/transcribe.py --date "$d" --threads 4 ${{ steps.pick.outputs.force == 'true' && '--force' || '' }}
            python3 tools/social.py --date "$d"
            gh release upload "$d" "build/social/$d/audiogram.mp4" "build/social/$d/quote.png" --repo "$GITHUB_REPOSITORY" --clobber
          done
      - name: Commit transcripts
        if: steps.pick.outputs.dates != ''
        run: |
          python3 tools/build.py
          git config user.name "Derinbay Labs"
          git config user.email "podcast@derinbay.com"
          git add -A episodes bolum konu sozluk hafta arsiv feed.xml index.html sitemap.xml
          if git commit -m "Transkript: ${{ steps.pick.outputs.dates }}"; then
            git pull --rebase origin master
            git push origin HEAD:master
            gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref master
          else
            echo "no changes"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
