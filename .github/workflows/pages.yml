name: Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Build feed and pages
        run: python3 tools/build.py
      - name: Collect site
        run: |
          mkdir _site
          cp -r index.html feed.xml CNAME .nojekyll assets _site/
          [ -d bolum ] && cp -r bolum _site/ || true
          rm -f _site/assets/cover.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
