name: Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
      - name: Build feed and pages
        run: python3 tools/build.py
      - name: Collect site
        run: |
          mkdir _site
          cp -r index.html feed.xml CNAME .nojekyll assets _site/
          [ -d bolum ] && cp -r bolum _site/ || true
          rm -f _site/assets/cover.html _site/assets/badges/README.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      # tell Podcast Index (and the apps that follow it) that the feed changed; best effort
      - name: Notify Podcast Index
        run: |
          curl -fsS -A "halimiz-podcast/1.0 (+https://halimiz.derinbay.com)" \
            "https://api.podcastindex.org/api/1.0/hub/pubnotify?url=https%3A%2F%2Fhalimiz.derinbay.com%2Ffeed.xml" || true
