name: Bölüm yayımla

on:
  push:
    branches: ["inbox/**"]

permissions:
  contents: write
  actions: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    outputs:
      test: ${{ steps.meta.outputs.test }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          path: site
      - name: Checkout inbox
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: payload
      - name: Read episode metadata
        id: meta
        run: |
          echo "test=$(python3 -c "import json;print(str(json.load(open('payload/inbox/episode.json')).get('test', False)).lower())")" >> "$GITHUB_OUTPUT"
      - name: Release + episodes.json + feed
        working-directory: site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ingest.py ../payload/inbox
      - name: Commit to master
        if: steps.meta.outputs.test != 'true'
        working-directory: site
        run: |
          git config user.name "Derinbay Labs"
          git config user.email "podcast@derinbay.com"
          git add -A episodes.json episodes bolum konu sozluk hafta arsiv hakkinda feed.xml index.html sitemap.xml 404.html robots.txt
          git commit -m "Bölüm: $(python3 -c "import json;print(json.load(open('../payload/inbox/episode.json'))['title'])")" || echo "no changes"
          git push origin HEAD:master
      # A push made with GITHUB_TOKEN does not trigger other workflows, and the github-pages
      # environment only accepts deployments from master, so start the Pages workflow on master.
      - name: Deploy Pages
        if: steps.meta.outputs.test != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref master
      # e-mail the bulletin to newsletter subscribers (needs the BUTTONDOWN_API_KEY secret; skipped without it)
      - name: Newsletter
        if: steps.meta.outputs.test != 'true'
        working-directory: site
        env:
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
        run: python3 tools/newsletter.py --date "$(python3 -c "import json;print(json.load(open('../payload/inbox/episode.json'))['date'])")" || true
      - name: Delete inbox branch
        if: always()
        working-directory: site
        run: git push origin --delete "${{ github.ref_name }}"
