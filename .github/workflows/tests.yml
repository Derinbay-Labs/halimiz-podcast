name: Tests

on:
  pull_request:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  unit:
    runs-on: [self-hosted, Linux, light]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Unit tests
        run: python3 -m unittest discover -s tests
